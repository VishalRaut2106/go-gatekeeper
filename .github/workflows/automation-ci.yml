name: Automation Server CI

on:
  push:
    paths:
      - 'automation-server/**'
      - '.github/workflows/automation-ci.yml'
  pull_request:
    paths:
      - 'automation-server/**'
      - '.github/workflows/automation-ci.yml'

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: automation-server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run build

      - name: Run Automated Tests
        run: npm test
